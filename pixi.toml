[project]
name = "bellerophon"
version = "0.1.0"
description = "Rust-first Bellerophon pipeline for filtering junction-spanning mapped reads."
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64"]

[dependencies]
rust = ">=1.89.0,<2"
c-compiler = ">=1.11.0,<2"
cxx-compiler = ">=1.11.0,<2"
pkg-config = ">=0.29.2,<0.30"
make = ">=4.4.1,<5"
libclang = ">=22.1.4,<23"

[tasks]
build = "bash -lc 'export LIBCLANG_PATH=\"${CONDA_PREFIX:-$PIXI_PROJECT_ROOT/.pixi/envs/default}/lib\"; cargo build --release --manifest-path rust/bellerophon-rs/Cargo.toml'"
test = "bash -lc 'export LIBCLANG_PATH=\"${CONDA_PREFIX:-$PIXI_PROJECT_ROOT/.pixi/envs/default}/lib\"; cargo test --manifest-path rust/bellerophon-rs/Cargo.toml'"
help = "bash -lc 'export LIBCLANG_PATH=\"${CONDA_PREFIX:-$PIXI_PROJECT_ROOT/.pixi/envs/default}/lib\"; cargo run --release --manifest-path rust/bellerophon-rs/Cargo.toml -- --help'"
install-local = "bash -lc 'export LIBCLANG_PATH=\"${CONDA_PREFIX:-$PIXI_PROJECT_ROOT/.pixi/envs/default}/lib\"; bash scripts/install_bellerophon_rs.sh \"${BELLEROPHON_RS_PREFIX:-$PIXI_PROJECT_ROOT/.pixi-local}\"'"
