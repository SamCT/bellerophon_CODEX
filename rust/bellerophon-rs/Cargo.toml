[package]
name = "bellerophon-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
crossbeam-channel = "0.5"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
noodles-bam = "0.79"
noodles-bgzf = "0.37"
noodles-sam = "0.75"
# rust-htslib has not published a 1.x release yet; 0.51.0 is the
# currently integrated API surface in this codebase/lockfile.
rust-htslib = { path = "../../vendor/rust-htslib-0.51.0", default-features = false }
tempfile = "3.13"

[dev-dependencies]
pretty_assertions = "1.4"
