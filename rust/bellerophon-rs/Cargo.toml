[package]
name = "bellerophon-rs"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "bellerophon-rs"
path = "src/main.rs"

[dependencies]
crossbeam-channel = "0.5"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
noodles-bam = "0.79"
noodles-bgzf = "0.37"
noodles-sam = "0.75"
rust-htslib = { version = "1.0.0", default-features = false, features = ["libdeflate"] }
tempfile = "3.13"

[dev-dependencies]
assert_cmd = "2.0"
pretty_assertions = "1.4"
wait-timeout = "0.2"
