[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bellerophon"
description = "Filter reads of a minimum quality that span a junction, retaining the 5´ side of that junction"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Dave Bouvier", email = "dave@bx.psu.edu" },
]
license = { text = "MIT" }
dependencies = [
  "pysam>=0.22",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/davebx/bellerophon"

[project.scripts]
bellerophon = "bellerophon.cli:main"

[tool.setuptools]
packages = ["bellerophon"]

[tool.setuptools.dynamic]
version = { attr = "bellerophon.__version__" }
